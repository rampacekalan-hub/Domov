<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e6e0"/>
      <stop offset="100%" stop-color="#d9c4ba"/>
    </linearGradient>
    <linearGradient id="couch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4df"/>
      <stop offset="100%" stop-color="#c9c2bb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- floor -->
  <rect x="0" y="380" width="400" height="120" fill="#bfa89a" opacity="0.4"/>
  <!-- couch -->
  <rect x="40" y="280" width="320" height="130" rx="20" fill="url(#couch)"/>
  <rect x="40" y="240" width="320" height="60" rx="14" fill="#d8d3cc"/>
  <!-- person silhouette -->
  <circle cx="200" cy="170" r="42" fill="#3d2e26"/>
  <path d="M150,210 Q200,200 250,210 L260,310 Q200,300 140,310 Z" fill="#1b1f4d"/>
  <!-- legs -->
  <rect x="170" y="300" width="22" height="80" fill="#2a2a2a"/>
  <rect x="208" y="300" width="22" height="80" fill="#2a2a2a"/>
  <!-- laptop on side table -->
  <rect x="290" y="240" width="80" height="6" fill="#1a1a1a"/>
  <rect x="295" y="200" width="70" height="42" fill="#2a2a2a" rx="2"/>
  <rect x="299" y="204" width="62" height="34" fill="#4a4a4a"/>
</svg>
